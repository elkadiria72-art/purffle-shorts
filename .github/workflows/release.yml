name: Release & Daily Shorts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # تجربة الموديلات المتاحة بالتوالي لتفادي خطأ 503
      - name: Generate Shorts Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python -m purffle_shorts make --model gemini-1.5-flash || python -m purffle_shorts make --model gemini-2.0-flash || python -m purffle_shorts make

      - name: Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            output_videos/**/short.mp4
            output_videos/
            *.mp4
