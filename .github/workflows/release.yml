name: Release & Daily Shorts

on:
  schedule:
    # تشغيل تلقائي يومياً في الساعة 18:00 بتوقيت UTC
    - cron: '0 18 * * *'
  workflow_dispatch: # تشغيل يدوي من زر Run workflow

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المستودع
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. إعداد بايثون 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. تثبيت برنامج FFmpeg الضروري لتجميع الفيديو والمونتاج
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. تثبيت حزمة purffle-shorts والمكتبات
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # 5. تشغيل أمر صنع الفيديو المباشر مع تحديد النموذج المحدث
      - name: Generate Shorts Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          LLM_MODEL: "gemini-3.8-flash"
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python -m purffle_shorts make --model gemini-3.8-flash || python -m purffle_shorts make

     # 6. حفظ الفيديو الناتج في غيت هاب لتستطيع تحميله ومعاينته
      - name: Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            output_videos/**/short.mp4
            output_videos/
            *.mp4
