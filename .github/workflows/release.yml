name: Release & Daily Shorts

on:
  schedule:
    # تشغيل تلقائي يومياً في الساعة 18:00 بتوقيت UTC
    - cron: '0 18 * * *'
  workflow_dispatch: # يتيح لك إمكانية التشغيل اليدوي بزر Run workflow

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل كود المشروع من غيت هاب إلى الخادم الافتراضي
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة بايثون (الإصدار 3.12)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. تثبيت المكتبات والمتطلبات الخاصة بالمشروع
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # 4. تشغيل السكربت الرئيسي لتوليد الفيديو ورفعه
      - name: Run Shorts Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python -m purffle_shorts --help || python -m purffle_shorts.cli || python -m purffle_shorts
          # 5. رفع الفيديو الناتج إلى GitHub Artifacts ليمكنك تحميله ورؤيته
      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            *.mp4
            output/
