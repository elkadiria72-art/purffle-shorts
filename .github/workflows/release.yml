name: Release & Daily Shorts

on:
  schedule:
    - cron: '0 18 * * *' # يعمل تلقائياً كل يوم الساعة 6 مساءً بتوقيت UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and run main script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          pip install .
          # تشغيل سكربت توليد ونشر الفيديو مباشرة
          python -m purffle_shorts || python main.py || echo "Running workflow"
